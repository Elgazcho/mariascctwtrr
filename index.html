<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria's Coconut Water - Nature Luxury Drink</title>
    <link rel="stylesheet" href="gloria-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-left">
                <a href="#" class="nav-link">OUR MENU</a>
                <a href="#" class="nav-link">OUR MISSION</a>
                <a href="#" class="nav-link">OUTPOST</a>
                <a href="#" class="nav-link">LOCATION</a>
            </div>

            <!-- BLOQUE DEL LOGO MODIFICADO -->
            <div class="logo">
                <a href="/">
                    <img src="logo.png" alt="Gloria's Coconut Water Logo" class="logo-image">
                </a>
            </div>

            <div class="nav-right">
                <a href="#" class="nav-link">SIGN IN</a>
                <a href="#" class="btn-order">ORDER</a>
            </div>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-image" style="background-image: url('grande.png');">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h2 class="hero-text">nature<br/>luxury drink</h2>
            </div>
        </div>
    </section>

    <!-- SECCIÓN PURE COCO -->
    <section class="pure-coco">
        <div class="pure-coco-header">
            <div class="pure-coco-title">
                <h2>PURE COCO</h2>
                <p class="pure-coco-subtitle">MADE IN PUERTO RICO</p>
            </div>
            <a href="#" class="btn-get-it">GET IT</a>
        </div>

        <!-- PRODUCTOS -->
        <div class="products-grid">
            <!-- Producto 1 -->
            <div class="product-card">
                <div class="product-image" style="background-image: url('bote1.png'); background-position: left center;"></div>
                <div class="product-badge">NEW</div>
            </div>

            <!-- Producto 2 -->
            <div class="product-card">
                <div class="product-image" style="background-image: url('bote2.png'); background-position: right center;"></div>
                <div class="product-badge">NEW</div>
            </div>
        </div>
    </section>

    <!-- FLECHA HACIA ARRIBA -->
    <div class="scroll-to-top">
        <a href="#" class="arrow-up">↑</a>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <div class="large-g">G</div>
            </div>

            <div class="footer-email">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Tu correo aquí" class="email-input">
            </div>

            <div class="footer-social">
                <a href="#" class="social-link">INSTAGRAM</a>
                <a href="#" class="social-link">PINTEREST</a>
                <a href="#" class="social-link">FACEBOOK</a>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy;2024 PUERTO RICO</p>
        </div>
    </footer>
</body>
</html>
